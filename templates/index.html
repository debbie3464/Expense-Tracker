<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The expense tracker </title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='heatmap/styles.css') }}">
    <script src="{{ url_for('static', filename='heatmap/index.global.js') }}"></script>
</head>

<body>
    <nav>
        <div class="logo">
            <h1>i will draw cool logo later</h1>
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' else '' }}">Dashboard</a>
            <a href="/split" class="{{ 'active' if request.path == '/split' else '' }}">Split</a>
            <a href="/settings" class="{{ 'active' if request.path == '/settings' else '' }}">Settings</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>
    <div class="date-time">
        <h2 id="live-datetime">Loading...</h2>
    </div>
    <div class="daily-spending">

        <progress class='daily-progress' id="daily-progress" value="0" max="2000"></progress>

        <div class="budget-summary">
            <p class="budget-spent" id="large-budget-spent">₹0 spent today</p>
            <h4 class="budget-target">of ₹2000 Daily Budget</h4>
        </div>

        <form id="expense" class="expense">
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description">
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <button type="submit">
                Add Expense
            </button>

        </form>
    </div>
    <div class="analytics-section">
        <div class="analytics-header">
            <h1>TODAY'S ANALYTICS</h1>
            <div class="period-toggle">
                <button class="period-btn active" data-period="today">Today</button>
                <button class="period-btn" data-period="weekly">Weekly</button>
                <button class="period-btn" data-period="monthly">Monthly</button>
                <button class="period-btn" data-period="yearly">Yearly</button>
            </div>
        </div>
    </div>

    <div class="visualizations">
        <div class="pie-chart">
            <canvas id="pieChart"></canvas>
        </div>
        <div class="line-chart">
            <canvas id="dailyChart"></canvas>
        </div>
    </div>
    <details class="pie-chart heatmap-collapsible" open>
        <summary>SPENDING HEATMAP</summary>
        <div id="spending-heatmap"></div>
    </details >
    
    <h1>TODAY'S EXPENSE HISTORY</h1>

    <div class="expense-history">

        <table class="expense-table">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Date & Time</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="expense-list">

            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="static/script.js"></script>
    <script src="static/transitions.js"></script>
</body>
