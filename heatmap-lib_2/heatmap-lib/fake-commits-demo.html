<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styles.css">
    <script src="dist-standalone/index.global.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 60px;

            background-color: rgb(13, 13, 11);
            color: white;
            font-family: 'Times New Roman', Times, serif;
        }

        #app .chm-cell {
            border-radius: 0;
        }

        #commit-form {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #commit-form input {
            padding: 6px 10px;
            font-size: 1rem;
            width: 80px;
        }

        #commit-form button {
            padding: 6px 16px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
    <title>Fake Commit Tracker</title>
</head>

<body>
    <h1>Fake Commit Tracker</h1>

    <form id="commit-form">
        <label for="commit-count">Commits today:</label>
        <input type="number" id="commit-count" min="0" max="10" value="1" required>
        <button type="submit">Commit</button>
    </form>

    <div id="app"></div>

    <script>
        // Keep track of fake commits per day, keyed 'YYYY-MM-DD'.
        const commitData = {};

        function todayKey() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        const now = new Date();

        const heatmap = new HeatmapLib.CalendarHeatmap({
            container: document.getElementById('app'),
            year: now.getFullYear(),
            month: now.getMonth(), // current month, 0-indexed
            data: commitData,
            colorRange: ['#0d3b1e', '#39d353'], // dark green -> bright green, GitHub-ish
            valueRange: [0, 10],
        });

        heatmap.render();

        document.getElementById('commit-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const count = Number(document.getElementById('commit-count').value);
            const key = todayKey();

            commitData[key] = count;

            heatmap.setData(commitData); // re-renders with the new data
        });
    </script>
</body>

</html>
